<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>머지냥 디펜스 · 이미지 에셋 UI</title>
<style>@font-face{font-family:Noto;src:url(fonts/NotoSansKR.ttf)}*{box-sizing:border-box}body{margin:0;background:#eeebe5;color:#39383c;font:14px Noto,sans-serif}header{height:76px;padding:18px 28px;display:flex;align-items:center;gap:18px;background:#fffdf7;border-bottom:1px solid #d8d4cb;position:sticky;top:0;z-index:5}h1{font-size:19px;margin:0}header small{color:#777}button,select,input{font:inherit;padding:8px 11px;border:1px solid #c7c6ba;border-radius:8px;background:#fffdf7;color:#43433f;cursor:pointer}button.active{background:#d7e8d1}main{display:grid;grid-template-columns:248px minmax(410px,1fr) 340px;min-height:calc(100vh - 76px)}aside{padding:18px;background:#faf8f1;overflow:auto;max-height:calc(100vh - 76px);position:sticky;top:76px}aside h2{font-size:15px;margin:10px 0}.screen-link{display:block;width:100%;text-align:left;margin:5px 0;font-size:12px}.group{font-weight:700;margin:20px 0 8px;color:#827664}.stage-zone{padding:24px;display:flex;align-items:flex-start;justify-content:center;overflow:auto}#wrap{position:relative;flex-shrink:0}#stage{width:1080px;height:1920px;position:absolute;left:0;top:0;transform-origin:top left;overflow:hidden;background:none}#stage .layer{position:absolute;user-select:none}#stage img{pointer-events:none}#stage .hit{background:transparent;border:0;padding:0;border-radius:0;cursor:pointer}#stage.inspect .hit{pointer-events:none}#stage.inspect img{pointer-events:auto;cursor:crosshair}#stage.inspect img.selected{outline:4px solid #ed477f;outline-offset:0}#detail{white-space:pre-wrap;font:12px/1.7 monospace;word-break:break-all}#asset-preview{width:100%;max-height:200px;object-fit:contain;background:#dfddd5}#layer-list{width:100%;height:280px;font-size:11px}#gallery,#asset-grid,#motion-grid{display:none;padding:26px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}.tile{background:#fffdf8;padding:10px;border:1px solid #d7d3c8;border-radius:12px;cursor:pointer;overflow:hidden}.tile img{width:100%;height:auto;display:block}.tile span{display:block;margin:10px 3px 2px;font-size:13px}.asset img{height:200px;object-fit:contain;background:#e5e2dc}.note{line-height:1.7;color:#7b766d;font-size:12px}a{color:#397c70}#status{font-size:12px;color:#766d66}#motion-grid .tile img{height:300px;object-fit:contain}.wide{grid-column:1/-1}code{font-family:monospace;font-size:12px}@media(max-width:1000px){main{grid-template-columns:190px 1fr}#properties{display:none}header small{display:none}}</style>
<header><h1>머지냥 디펜스</h1><small>PASTEL RASTER UI · V3</small><button id="screen-tab" class="active">화면 검사</button><button id="gallery-tab">전체 메뉴</button><button id="assets-tab">개별 에셋</button><button id="motion-tab">2프레임</button><span id="status"></span></header>
<main id="inspector"><aside><input id="search" placeholder="메뉴 검색" style="width:100%"><div id="screen-list"></div></aside><section class="stage-zone"><div id="wrap"><div id="stage" class="inspect"></div></div></section><aside id="properties"><h2 id="screen-title"></h2><p class="note">1080 × 1920 · 좌측 상단 원점<br>화면의 요소를 선택하면 파일과 좌표가 표시됩니다.</p><button id="mode">검사 모드</button> <button id="open-screen">PNG 열기</button><p><select id="layer-list" size="12"></select></p><img id="asset-preview"><p id="asset-link"></p><pre id="detail">요소를 선택해 주세요.</pre></aside></main><section id="gallery"></section><section id="asset-grid"></section><section id="motion-grid"></section>
<script src="screens-data.js"></script><script src="assets-data.js"></script><script src="motion-data.js"></script><script>
const $=s=>document.querySelector(s);let current=SCREENS.find(s=>s.id==='workshop'),inspect=true,selected=null;const stages=new Map(SCREENS.map(s=>[s.id,s]));
function scale(){let n=Math.min((innerHeight-125)/1920,(document.querySelector('.stage-zone').clientWidth-52)/1080,.55);n=Math.max(.25,n);$('#stage').style.transform=`scale(${n})`;$('#wrap').style.width=1080*n+'px';$('#wrap').style.height=1920*n+'px'}
function select(e){selected=e;document.querySelectorAll('.selected').forEach(n=>n.classList.remove('selected'));const n=document.querySelector(`[data-id="${e.id}"]`);if(n)n.classList.add('selected');$('#layer-list').value=e.id;$('#asset-preview').src=e.asset||'';$('#asset-link').innerHTML=e.asset?`<a href="${e.asset}" target="_blank">개별 PNG 열기</a>`:'';$('#detail').textContent=JSON.stringify({id:e.id,asset:e.asset,sourceAsset:e.sourceAsset,text:e.textContent,x:e.x,y:e.y,width:e.width,height:e.height,yScene2D:e.yScene2D,z:e.z,hitRect:e.hitRect,states:e.states,action:e.action},null,2)}
function show(id){current=stages.get(id)||current;$('#stage').innerHTML='';$('#layer-list').innerHTML='';$('#screen-title').textContent=current.title;for(const e of current.elements){if(e.type==='hit')continue;const n=document.createElement('img');n.className='layer';n.src=e.asset;n.alt=e.textContent||e.assetId||e.id;n.dataset.id=e.id;Object.assign(n.style,{left:e.x+'px',top:e.y+'px',width:e.width+'px',height:e.height+'px',zIndex:e.z});n.onclick=()=>{if(inspect)select(e)};$('#stage').append(n);const o=document.createElement('option');o.value=e.id;o.textContent=`${e.z} · ${e.textContent||e.id}`;$('#layer-list').append(o)}for(const e of current.elements.filter(e=>e.action)){const b=document.createElement('button');b.className='layer hit';b.disabled=!!e.disabled;b.setAttribute('aria-label',e.id);const r=e.hitRect||e;Object.assign(b.style,{left:r.x+'px',top:r.y+'px',width:r.width+'px',height:r.height+'px',zIndex:500+e.z});b.onclick=()=>{if(!inspect&&e.action.target)show(e.action.target)};function contentOffset(state){const off=e.alignmentStateOffsets?.[state]||{x:0,y:0};for(const child of current.elements.filter(c=>c.alignmentOwner===e.id)){const n=document.querySelector('[data-id="'+child.id+'"]');if(n){n.style.left=(child.x+off.x)+'px';n.style.top=(child.y+off.y)+'px'}}}b.onpointerdown=()=>{contentOffset('pressed');if(e.states){const img=$(`[data-id="${e.id}"]`);if(img)img.src=e.states.pressed}};b.onpointerup=b.onpointerleave=()=>{contentOffset('normal');if(e.states){const img=$(`[data-id="${e.id}"]`);if(img)img.src=e.states.normal}};$('#stage').append(b)}scale();$('#status').textContent=`${SCREENS.length}개 화면 · ${ASSETS.length}개 원화 에셋`;if(current.elements[0])select(current.elements[0])}
function screenList(){const q=$('#search').value;$('#screen-list').innerHTML='';let group='';for(const s of SCREENS.filter(s=>(s.title+' '+s.id).includes(q))){if(s.group!==group){group=s.group;const h=document.createElement('div');h.className='group';h.textContent=group;$('#screen-list').append(h)}const b=document.createElement('button');b.className='screen-link';b.textContent=s.title;b.onclick=()=>{tab('screen');show(s.id)};$('#screen-list').append(b)}}
function tab(t){$('#inspector').style.display=t==='screen'?'grid':'none';for(const [key,id]of [['gallery','#gallery'],['assets','#asset-grid'],['motion','#motion-grid']])$(id).style.display=t===key?'grid':'none';document.querySelectorAll('header button').forEach(b=>b.classList.toggle('active',b.id===t+'-tab'));if(t==='screen')scale()}
$('#layer-list').onchange=()=>select(current.elements.find(e=>e.id===$('#layer-list').value));$('#search').oninput=screenList;$('#mode').onclick=()=>{inspect=!inspect;$('#stage').classList.toggle('inspect',inspect);$('#mode').textContent=inspect?'검사 모드':'메뉴 이동 모드'};$('#open-screen').onclick=()=>window.open('screens/'+current.id+'.png');['screen','gallery','assets','motion'].forEach(t=>$('#'+t+'-tab').onclick=()=>tab(t));
for(const s of SCREENS){const d=document.createElement('div');d.className='tile';d.innerHTML=`<img loading="lazy" src="screens/${s.id}.png"><span>${s.title}</span>`;d.onclick=()=>{tab('screen');show(s.id)};$('#gallery').append(d)}
for(const a of ASSETS){const d=document.createElement('div');d.className='tile asset';d.innerHTML=`<img loading="lazy" src="${a.file}"><span>${a.id}</span><span>${a.width} × ${a.height} · ${a.alpha?'RGBA':'배경'}</span>`;d.onclick=()=>window.open(a.file);$('#asset-grid').append(d)}
for(const m of MOTIONS){const d=document.createElement('div');d.className='tile';d.innerHTML=`<img data-motion="${m.id}" src="${m.action.frames[0]}"><span>${m.name} · 고정 크기 전진/반동</span>`;$('#motion-grid').append(d)}let f=0;setInterval(()=>{f=1-f;for(const m of MOTIONS){const n=$(`[data-motion="${m.id}"]`);if(n)n.src=m.action.frames[f]}},220);window.onresize=scale;screenList();show('workshop');
</script></html>
