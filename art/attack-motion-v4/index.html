<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>머지냥 — 공격 2프레임 검사</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eee7de;color:#3d3534;font:16px system-ui}header{position:sticky;top:0;z-index:2;background:#fffbf3ed;padding:18px 28px;border-bottom:1px solid #d6c7b8}h1{font-size:23px;margin:0 0 10px}button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #bbaa97;background:#fffaf0;margin-right:8px}main{padding:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:20px}article{border-radius:16px;background:#fffcf7;overflow:hidden;border:1px solid #d6c7b8;padding:15px}h2{font-size:18px;margin:0}small{color:#796d65}.stage{position:relative;width:100%;aspect-ratio:1;background:#e5e9e3;border-radius:12px;margin:12px 0;overflow:hidden}.stage img{width:100%;height:100%;position:absolute;inset:0}.stage:after{content:'';position:absolute;left:0;right:0;top:92.1875%;border-top:1px dashed #a39889;pointer-events:none}.pair{width:100%;background:#f1eadd;border-radius:8px}footer{padding:8px 24px 24px}.dark .stage{background:#283237}.phase{font-size:13px;margin-top:8px}.ghost{opacity:.24!important}a{color:#506966}</style>
<header><h1>머지냥 · 공격 모션 25종</h1><button id="play">일시정지</button><button id="step">다음 프레임</button><button id="bg">배경 전환</button><label>속도 <select id="speed"><option value="1">실시간</option><option value="2">느리게</option><option value=".5">빠르게</option></select></label><label><input id="overlay" type="checkbox"> 이전 프레임 겹쳐 보기</label></header>
<main id="grid"></main><footer>512 × 512 PNG · 기준점 (256, 472) · 준비 220ms / 타격 140ms<br>동일 배율과 기준점을 적용했습니다. 두 포즈는 별도로 그린 원화이므로 세부 윤곽의 픽셀 단위 동일성을 보장하지 않습니다. <a href="manifest.json">좌표 JSON</a> · <a href="README.md">사용 안내</a></footer>
<script src="data.js"></script><script>
let playing=true,frame=0,last=performance.now();const imgs=[],ghosts=[],labels=[];
for(const c of ATTACKS){const a=document.createElement('article');a.innerHTML='<h2>'+c.name+'</h2><small>'+c.id+'</small><div class="stage"><img class="ghost" style="display:none" alt="비교 프레임"><img class="actor" alt="'+c.name+' 공격"></div><div class="phase"></div><img class="pair" alt="준비와 타격 비교" src="'+c.sheet+'">';grid.append(a);imgs.push(a.querySelector('.actor'));ghosts.push(a.querySelector('.ghost'));labels.push(a.querySelector('.phase'));}
function draw(){ATTACKS.forEach((c,i)=>{imgs[i].src=c.frames[frame].file;ghosts[i].src=c.frames[1-frame].file;ghosts[i].style.display=overlay.checked?'block':'none';labels[i].textContent=(frame?'02 타격':'01 준비')+' · pivot 256, 472';});}draw();
play.onclick=()=>{playing=!playing;play.textContent=playing?'일시정지':'재생';last=performance.now()};step.onclick=()=>{playing=false;play.textContent='재생';frame=1-frame;draw()};bg.onclick=()=>document.body.classList.toggle('dark');overlay.onchange=draw;
function tick(now){if(playing&&now-last>ATTACKS[0].frames[frame].durationMs*Number(speed.value)){frame=1-frame;last=now;draw()}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
