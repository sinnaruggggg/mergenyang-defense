# 태그(v*)를 올리면 테스트 → APK 빌드 → GitHub 릴리즈 생성
name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # 러너에 기본 설치된 Android SDK에 이 프로젝트가 쓰는 플랫폼만 추가
      - name: Android SDK 구성요소
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v6

      - name: 버전 정하기
        run: |
          ref="${GITHUB_REF_NAME}"
          if [[ "$ref" == v* ]]; then echo "VERSION_NAME=${ref#v}" >> "$GITHUB_ENV"; else echo "VERSION_NAME=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_ENV"; fi
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: 출시 키 준비 (Secrets가 있을 때만)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
              echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi

      - name: 테스트와 빌드
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core:test :android:assembleRelease

      - name: APK 이름 정리
        run: |
          mkdir -p out
          cp "$(find . -path '*outputs/apk/release/*.apk' | head -1)" "out/mergenyang-${VERSION_NAME}.apk"
          ls -la out

      - name: 릴리즈 올리기
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: native/out/*.apk
          generate_release_notes: true

      - name: 수동 실행 결과물
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v7
        with:
          name: mergenyang-apk
          path: native/out/*.apk
