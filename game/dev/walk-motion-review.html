<!doctype html><html lang="ko"><meta charset="utf-8"><title>머지냥 걷기 모션 검수</title>
<style>body{margin:0;background:#29211f;color:#fff7e8;font:16px system-ui;padding:24px}h1{margin:0 0 8px}.note{color:#dbcbb6}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:22px}.card{background:#443831;border:1px solid #776253;border-radius:12px;padding:10px;text-align:center}.stage{height:170px;background:#65746a;border-radius:9px;position:relative;overflow:hidden}.stage:after{content:'';left:10px;right:10px;bottom:14px;border-top:1px dashed #e6d0aa;position:absolute}.stage img{width:170px;height:170px;object-fit:contain;position:absolute;inset:0;margin:auto}.name{padding-top:8px;font-weight:700}.meta{font-size:12px;color:#cbbcac}</style>
<h1>걷기 모션 · 25종 / 50 프레임</h1><p class="note">0.18초마다 전환합니다. 두 프레임은 같은 512×512 원본 비트맵을 3px 위로 이동시킨 것이라 배율·몸집·형태가 변하지 않습니다.</p><div id="grid"></div>
<script>fetch('../assets/walk/manifest.json').then(r=>r.json()).then(d=>{for(const c of d.characters){const e=document.createElement('div');e.className='card';e.innerHTML='<div class="stage"><img src="../assets/walk/'+c.frames[0].file+'"></div><div class="name">'+c.id+'</div><div class="meta">pivot 256, 472 · '+c.frames[0].durationMs+'ms</div>';grid.append(e)}let f=0;setInterval(()=>{f=1-f;document.querySelectorAll('.stage img').forEach((i,n)=>i.src='../assets/walk/'+d.characters[n].frames[f].file)},180)})</script>
